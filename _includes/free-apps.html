{% if site.data.apps.size > 0 %}
<div class="free-apps" role="group" aria-labelledby="free-apps-heading">
  <hr class="free-apps-divider" aria-hidden="true">
  <p class="free-apps-heading" id="free-apps-heading">Free apps I built</p>
  <div class="free-apps-row" role="list">
    {% for app in site.data.apps %}
    <div class="free-apps-item" role="listitem">
      <a class="free-app-link" href="{{ app.url | relative_url }}" aria-label="{{ app.label | escape }}" title="{{ app.label | escape }}">
        <img src="{{ app.icon | relative_url }}" width="33" height="33" alt="" decoding="async">
        <span class="free-app-label">{% if app.label_html %}{{ app.label_html }}{% else %}{{ app.label | escape }}{% endif %}</span>
      </a>
    </div>
    {% endfor %}
  </div>
</div>
{% endif %}
